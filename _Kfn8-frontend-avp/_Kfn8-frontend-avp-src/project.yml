# xcodegen spec for the Kfn8 client component. Run `xcodegen generate` from this directory with the Xcode 27
# toolchain. The generated .xcodeproj is disposable; this file is the source of truth.
name: Kfn8
options:
  bundleIdPrefix: com.appliaison.kfn8
  deploymentTarget:
    visionOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # OffsideAI Inc. developer team (the account signed into Xcode 27; verified by a signed device build on 2026-09-22).
    # The legacy iOS project used G7Y435RZV6, which has no account on this Mac.
    DEVELOPMENT_TEAM: 9L38FSU6M7
packages:
  Kfn8M0ProbeCore:
    path: Packages/Kfn8M0ProbeCore
  Kfn8Kit:
    path: Packages/Kfn8Kit
targets:
  Kfn8:
    type: application
    platform: visionOS
    deploymentTarget: "27.0"
    sources:
      - path: Kfn8
        excludes: ["Resources/**"]
      - path: Kfn8/Resources/Catalogue
        type: folder
        buildPhase: resources
      - path: Kfn8/Resources/Fonts
        buildPhase: resources
      - path: Kfn8M0Probe/Assets.xcassets
    dependencies:
      - package: Kfn8Kit
        product: Kfn8Domain
      - package: Kfn8Kit
        product: Kfn8Persistence
      - package: Kfn8Kit
        product: Kfn8Catalogue
    info:
      path: Kfn8/Info.plist
      properties:
        CFBundleDisplayName: Kfn8
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
        UIAppFonts: [Fraunces.ttf, HankenGrotesk.ttf]
        NSWorldSensingUsageDescription: Kfn8 finds your floor, walls and furniture so pieces sit at true scale in your room. Your scan never leaves this device.
        ITSAppUsesNonExemptEncryption: false
        # Empty until the catalogue API is deployed (M2 provisioning is a founder action).
        Kfn8APIBaseURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appliaison.kfn8.visionos
        PRODUCT_NAME: Kfn8
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "7"
        SUPPORTED_PLATFORMS: "xros xrsimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Kfn8UITests:
    type: bundle.ui-testing
    platform: visionOS
    deploymentTarget: "27.0"
    sources: [Kfn8UITests]
    dependencies:
      - target: Kfn8
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appliaison.kfn8.uitests
        TEST_TARGET_NAME: Kfn8
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
  Kfn8M0Probe:
    type: application
    platform: visionOS
    deploymentTarget: "27.0"
    sources:
      - path: Kfn8M0Probe
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: Kfn8M0ProbeCore
    # xcodegen GENERATES this plist from `properties`; do not hand-edit Kfn8M0Probe/Info.plist.
    info:
      path: Kfn8M0Probe/Info.plist
      properties:
        CFBundleDisplayName: Kfn8 M0 Probe
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
        NSWorldSensingUsageDescription: The M0 probe detects floors, walls, ceilings and tables so virtual fixtures can attach to real surfaces. Nothing leaves the device.
        NSPhotoLibraryAddUsageDescription: Only used if you explicitly choose to save an exported still image of your room during the export probe.
    entitlements:
      path: Kfn8M0Probe/Kfn8M0Probe.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appliaison.kfn8.m0probe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Kfn8M0Probe
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "7"
        SUPPORTED_PLATFORMS: "xros xrsimulator"
        # Nonshipping probe: no App Store, no analytics, no accounts.
schemes:
  Kfn8:
    build:
      targets:
        Kfn8: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Kfn8UITests
        - package: Kfn8Kit/Kfn8DomainTests
        - package: Kfn8Kit/Kfn8PersistenceTests
  Kfn8M0Probe:
    build:
      targets:
        Kfn8M0Probe: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: Kfn8M0ProbeCore/Kfn8M0ProbeCoreTests
