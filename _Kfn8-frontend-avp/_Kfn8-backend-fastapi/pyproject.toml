[project]
name = "kfn8-backend"
version = "0.1.0"
description = "Kfn8 anonymous catalogue service, asset contract and private operator ingestion"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jsonschema>=4.22",
  "pygltflib>=1.16",
  "usd-core>=24.5",
  "boto3>=1.34",
  "pillow>=10.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27", "psycopg[binary]>=3.1"]

[project.scripts]
kfn8-validate = "kfn8.contract.cli:main"
kfn8-ingest = "kfn8.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kfn8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
